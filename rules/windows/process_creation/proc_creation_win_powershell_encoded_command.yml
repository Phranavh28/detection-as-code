title: PowerShell Started With An Encoded Command
id: b517a21f-4db9-4f68-bb4f-ae84aedd96ef
status: experimental
description: |
  Detects powershell.exe or pwsh.exe started with the EncodedCommand switch
  (or one of its short forms). Attackers Base64 encode commands to hide what
  they run from casual review and simple string matching.
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1027/
author: Phranavh Sivaraman
date: 2026-11-21
tags:
  - attack.execution
  - attack.defense-evasion
  - attack.t1059.001
  - attack.t1027
logsource:
  product: windows
  category: process_creation
detection:
  selection_img_path:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_img_pe:
    OriginalFileName:
      - PowerShell.EXE
      - pwsh.dll
  selection_cli:
    CommandLine|contains:
      - ' -e '
      - ' -en '
      - ' -enc '
      - ' -enco'
      - ' -ec '
  condition: 1 of selection_img_* and selection_cli
falsepositives:
  - Some legitimate management tools and installers run encoded PowerShell; build an allow list of their parent processes and signed paths
level: medium
